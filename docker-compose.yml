services:
  mysql:
    image: mysql:8.0
    container_name: homework-mysql
    environment:
      MYSQL_ROOT_PASSWORD: homework123
      MYSQL_DATABASE: homework_online
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-phomework123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: homework-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: homework_online
      DB_USER: root
      DB_PASSWORD: homework123
      APP_JWT_SECRET: change-me-in-production-homework-online-secret
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: homework-frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  mysql-data:
  uploads:
